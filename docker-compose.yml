services:
  db:
    image: postgres:17.4
    container_name: postgres_db_todo
    restart: always
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
  app:
    build: .
    container_name: todo_nestjs
    ports:
      - 3000:3000
    restart: always
    env_file:
      - .env
    depends_on:
      - db
    command: ['npm', 'run', 'start:dev']
volumes:
  postgres_data: {}
